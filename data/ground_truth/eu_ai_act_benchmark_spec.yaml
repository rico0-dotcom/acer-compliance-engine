# ACER benchmark specification
#
# This file defines the intended scenario conditions and expected compliance
# statuses independently of ACER's compliance checker.
#
# The generator consumes this specification to construct system models.
# The expected labels below are therefore benchmark ground truth, not ACER output.
#
# Statuses:
# PASS, FAIL, NOT_APPLICABLE
#
# For the first benchmark, each case has a single primary alteration. The
# generator also creates multi-violation and applicability cases.

