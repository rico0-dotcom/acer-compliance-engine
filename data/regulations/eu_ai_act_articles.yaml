- article: 14
  text: 'Article 14

    Human oversight

    1.

    High-risk AI systems shall be designed and developed in such a way, including
    with appropriate human-machine interface tools, that they can be effectively overseen
    by natural persons during the period in which they are in use.

    2.

    Human oversight shall aim to prevent or minimise the risks to health, safety or
    fundamental rights that may emerge when a high-risk AI system is used in accordance
    with its intended purpose or under conditions of reasonably foreseeable misuse,
    in particular where such risks persist despite the application of other requirements
    set out in this Section.

    3.

    The oversight measures shall be commensurate with the risks, level of autonomy
    and context of use of the high-risk AI system, and shall be ensured through either
    one or both of the following types of measures:

    (a)

    measures identified and built, when technically feasible, into the high-risk AI
    system by the provider before it is placed on the market or put into service;

    (b)

    measures identified by the provider before placing the high-risk AI system on
    the market or putting it into service and that are appropriate to be implemented
    by the deployer.

    4.

    For the purpose of implementing paragraphs 1, 2 and 3, the high-risk AI system
    shall be provided to the deployer in such a way that natural persons to whom human
    oversight is assigned are enabled, as appropriate and proportionate:

    (a)

    to properly understand the relevant capacities and limitations of the high-risk
    AI system and be able to duly monitor its operation, including in view of detecting
    and addressing anomalies, dysfunctions and unexpected performance;

    (b)

    to remain aware of the possible tendency of automatically relying or over-relying
    on the output produced by a high-risk AI system (automation bias), in particular
    for high-risk AI systems used to provide information or recommendations for decisions
    to be taken by natural persons;

    (c)

    to correctly interpret the high-risk AI system’s output, taking into account,
    for example, the interpretation tools and methods available;

    (d)

    to decide, in any particular situation, not to use the high-risk AI system or
    to otherwise disregard, override or reverse the output of the high-risk AI system;

    (e)

    to intervene in the operation of the high-risk AI system or interrupt the system
    through a ‘stop’ button or a similar procedure that allows the system to come
    to a halt in a safe state.

    5.

    For high-risk AI systems referred to in point 1(a) of Annex III, the measures
    referred to in paragraph 3 of this Article shall be such as to ensure that, in
    addition, no action or decision is taken by the deployer on the basis of the identification
    resulting from the system unless that identification has been separately verified
    and confirmed by at least two natural persons with the necessary competence, training
    and authority.

    The requirement for a separate verification by at least two natural persons shall
    not apply to high-risk AI systems used for the purposes of law enforcement, migration,
    border control or asylum, where Union or national law considers the application
    of this requirement to be disproportionate.'
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- article: 15
  text: 'Article 15

    Accuracy, robustness and cybersecurity

    1.

    High-risk AI systems shall be designed and developed in such a way that they achieve
    an appropriate level of accuracy, robustness, and cybersecurity, and that they
    perform consistently in those respects throughout their lifecycle.

    2.

    To address the technical aspects of how to measure the appropriate levels of accuracy
    and robustness set out in paragraph 1 and any other relevant performance metrics,
    the Commission shall, in cooperation with relevant stakeholders and organisations
    such as metrology and benchmarking authorities, encourage, as appropriate, the
    development of benchmarks and measurement methodologies.

    3.

    The levels of accuracy and the relevant accuracy metrics of high-risk AI systems
    shall be declared in the accompanying instructions of use.

    4.

    High-risk AI systems shall be as resilient as possible regarding errors, faults
    or inconsistencies that may occur within the system or the environment in which
    the system operates, in particular due to their interaction with natural persons
    or other systems. Technical and organisational measures shall be taken in this
    regard.

    The robustness of high-risk AI systems may be achieved through technical redundancy
    solutions, which may include backup or fail-safe plans.

    High-risk AI systems that continue to learn after being placed on the market or
    put into service shall be developed in such a way as to eliminate or reduce as
    far as possible the risk of possibly biased outputs influencing input for future
    operations (feedback loops), and as to ensure that any such feedback loops are
    duly addressed with appropriate mitigation measures.

    5.

    High-risk AI systems shall be resilient against attempts by unauthorised third
    parties to alter their use, outputs or performance by exploiting system vulnerabilities.

    The technical solutions aiming to ensure the cybersecurity of high-risk AI systems
    shall be appropriate to the relevant circumstances and the risks.

    The technical solutions to address AI specific vulnerabilities shall include,
    where appropriate, measures to prevent, detect, respond to, resolve and control
    for attacks trying to manipulate the training data set (data poisoning), or pre-trained
    components used in training (model poisoning), inputs designed to cause the AI
    model to make a mistake (adversarial examples or model evasion), confidentiality
    attacks or model flaws.

    SECTION 3

    Obligations of providers and deployers of high-risk AI systems and other parties'
