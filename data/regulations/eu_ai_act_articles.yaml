- article: 50
  text: 'Article 50

    Transparency obligations for providers and deployers of certain AI systems

    1.

    Providers shall ensure that AI systems intended to interact directly with natural
    persons are designed and developed in such a way that the natural persons concerned
    are informed that they are interacting with an AI system, unless this is obvious
    from the point of view of a natural person who is reasonably well-informed, observant
    and circumspect, taking into account the circumstances and the context of use.
    This obligation shall not apply to AI systems authorised by law to detect, prevent,
    investigate or prosecute criminal offences, subject to appropriate safeguards
    for the rights and freedoms of third parties, unless those systems are available
    for the public to report a criminal offence.

    2.

    Providers of AI systems, including general-purpose AI systems, generating synthetic
    audio, image, video or text content, shall ensure that the outputs of the AI system
    are marked in a machine-readable format and detectable as artificially generated
    or manipulated. Providers shall ensure their technical solutions are effective,
    interoperable, robust and reliable as far as this is technically feasible, taking
    into account the specificities and limitations of various types of content, the
    costs of implementation and the generally acknowledged state of the art, as may
    be reflected in relevant technical standards. This obligation shall not apply
    to the extent the AI systems perform an assistive function for standard editing
    or do not substantially alter the input data provided by the deployer or the semantics
    thereof, or where authorised by law to detect, prevent, investigate or prosecute
    criminal offences.

    3.

    Deployers of an emotion recognition system or a biometric categorisation system
    shall inform the natural persons exposed thereto of the operation of the system,
    and shall process the personal data in accordance with Regulations (EU) 2016/679
    and (EU) 2018/1725 and Directive (EU) 2016/680, as applicable. This obligation
    shall not apply to AI systems used for biometric categorisation and emotion recognition,
    which are permitted by law to detect, prevent or investigate criminal offences,
    subject to appropriate safeguards for the rights and freedoms of third parties,
    and in accordance with Union law.

    4.

    Deployers of an AI system that generates or manipulates image, audio or video
    content constituting a deep fake, shall disclose that the content has been artificially
    generated or manipulated. This obligation shall not apply where the use is authorised
    by law to detect, prevent, investigate or prosecute criminal offence. Where the
    content forms part of an evidently artistic, creative, satirical, fictional or
    analogous work or programme, the transparency obligations set out in this paragraph
    are limited to disclosure of the existence of such generated or manipulated content
    in an appropriate manner that does not hamper the display or enjoyment of the
    work.

    Deployers of an AI system that generates or manipulates text which is published
    with the purpose of informing the public on matters of public interest shall disclose
    that the text has been artificially generated or manipulated. This obligation
    shall not apply where the use is authorised by law to detect, prevent, investigate
    or prosecute criminal offences or where the AI-generated content has undergone
    a process of human review or editorial control and where a natural or legal person
    holds editorial responsibility for the publication of the content.

    5.

    The information referred to in paragraphs 1 to 4 shall be provided to the natural
    persons concerned in a clear and distinguishable manner at the latest at the time
    of the first interaction or exposure. The information shall conform to the applicable
    accessibility requirements.

    6.

    Paragraphs 1 to 4 shall not affect the requirements and obligations set out in
    Chapter III, and shall be without prejudice to other transparency obligations
    laid down in Union or national law for deployers of AI systems.

    ▼M1

    7.

    The Commission shall encourage and facilitate the drawing up of codes of practice
    at Union level to facilitate the effective implementation of the obligations regarding
    the detection, marking and labelling of artificially generated or manipulated
    content. The Commission, taking utmost account of the opinion of the Board, shall
    assess whether adherence to those codes of practice is adequate to ensure compliance
    with the obligations laid down in paragraphs 2 and 4 of this Article, in accordance
    with the procedure laid down in Article 56(6). If it deems the code of practice
    to be inadequate, the Commission may adopt an implementing act specifying common
    rules for the implementation of those obligations in accordance with the examination
    procedure laid down in Article 98(2).

    ▼B

    CHAPTER V

    GENERAL-PURPOSE AI MODELS

    SECTION 1

    Classification rules'
