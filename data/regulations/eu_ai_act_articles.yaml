- article: 10
  text: 'Article 10

    Data and data governance

    ▼M1

    1.

    High-risk AI systems which make use of techniques involving the training of AI
    models with data shall be developed on the basis of training, validation and testing
    data sets that meet the quality criteria referred to in paragraphs 2, 3 and 4
    of this Article and in Article 4a(1) whenever such data sets are used.

    ▼B

    2.

    Training, validation and testing data sets shall be subject to data governance
    and management practices appropriate for the intended purpose of the high-risk
    AI system. Those practices shall concern in particular:

    (a)

    the relevant design choices;

    (b)

    data collection processes and the origin of data, and in the case of personal
    data, the original purpose of the data collection;

    (c)

    relevant data-preparation processing operations, such as annotation, labelling,
    cleaning, updating, enrichment and aggregation;

    (d)

    the formulation of assumptions, in particular with respect to the information
    that the data are supposed to measure and represent;

    (e)

    an assessment of the availability, quantity and suitability of the data sets that
    are needed;

    (f)

    examination in view of possible biases that are likely to affect the health and
    safety of persons, have a negative impact on fundamental rights or lead to discrimination
    prohibited under Union law, especially where data outputs influence inputs for
    future operations;

    (g)

    appropriate measures to detect, prevent and mitigate possible biases identified
    according to point (f);

    (h)

    the identification of relevant data gaps or shortcomings that prevent compliance
    with this Regulation, and how those gaps and shortcomings can be addressed.

    3.

    Training, validation and testing data sets shall be relevant, sufficiently representative,
    and to the best extent possible, free of errors and complete in view of the intended
    purpose. They shall have the appropriate statistical properties, including, where
    applicable, as regards the persons or groups of persons in relation to whom the
    high-risk AI system is intended to be used. Those characteristics of the data
    sets may be met at the level of individual data sets or at the level of a combination
    thereof.

    4.

    Data sets shall take into account, to the extent required by the intended purpose,
    the characteristics or elements that are particular to the specific geographical,
    contextual, behavioural or functional setting within which the high-risk AI system
    is intended to be used.

    ▼M1

    —————

    ▼M1

    6.

    For the development of high-risk AI systems not using techniques involving the
    training of AI models, paragraphs 2, 3 and 4 of this Article and Article 4a(1)
    shall apply only to the testing data sets.

    ▼B'
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- article: 12
  text: 'Article 12

    Record-keeping

    1.

    High-risk AI systems shall technically allow for the automatic recording of events
    (logs) over the lifetime of the system.

    2.

    In order to ensure a level of traceability of the functioning of a high-risk AI
    system that is appropriate to the intended purpose of the system, logging capabilities
    shall enable the recording of events relevant for:

    (a)

    identifying situations that may result in the high-risk AI system presenting a
    risk within the meaning of Article 79(1) or in a substantial modification;

    (b)

    facilitating the post-market monitoring referred to in Article 72; and

    (c)

    monitoring the operation of high-risk AI systems referred to in Article 26(5).

    3.

    For high-risk AI systems referred to in point 1 (a), of Annex III, the logging
    capabilities shall provide, at a minimum:

    (a)

    recording of the period of each use of the system (start date and time and end
    date and time of each use);

    (b)

    the reference database against which input data has been checked by the system;

    (c)

    the input data for which the search has led to a match;

    (d)

    the identification of the natural persons involved in the verification of the
    results, as referred to in Article 14(5).'
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- article: 13
  text: 'Article 13

    Transparency and provision of information to deployers

    1.

    High-risk AI systems shall be designed and developed in such a way as to ensure
    that their operation is sufficiently transparent to enable deployers to interpret
    a system’s output and use it appropriately. An appropriate type and degree of
    transparency shall be ensured with a view to achieving compliance with the relevant
    obligations of the provider and deployer set out in Section 3.

    2.

    High-risk AI systems shall be accompanied by instructions for use in an appropriate
    digital format or otherwise that include concise, complete, correct and clear
    information that is relevant, accessible and comprehensible to deployers.

    3.

    The instructions for use shall contain at least the following information:

    (a)

    the identity and the contact details of the provider and, where applicable, of
    its authorised representative;

    (b)

    the characteristics, capabilities and limitations of performance of the high-risk
    AI system, including:

    (i)

    its intended purpose;

    (ii)

    the level of accuracy, including its metrics, robustness and cybersecurity referred
    to in Article 15 against which the high-risk AI system has been tested and validated
    and which can be expected, and any known and foreseeable circumstances that may
    have an impact on that expected level of accuracy, robustness and cybersecurity;

    (iii)

    any known or foreseeable circumstance, related to the use of the high-risk AI
    system in accordance with its intended purpose or under conditions of reasonably
    foreseeable misuse, which may lead to risks to the health and safety or fundamental
    rights referred to in Article 9(2);

    (iv)

    where applicable, the technical capabilities and characteristics of the high-risk
    AI system to provide information that is relevant to explain its output;

    (v)

    when appropriate, its performance regarding specific persons or groups of persons
    on which the system is intended to be used;

    (vi)

    when appropriate, specifications for the input data, or any other relevant information
    in terms of the training, validation and testing data sets used, taking into account
    the intended purpose of the high-risk AI system;

    (vii)

    where applicable, information to enable deployers to interpret the output of the
    high-risk AI system and use it appropriately;

    (c)

    the changes to the high-risk AI system and its performance which have been pre-determined
    by the provider at the moment of the initial conformity assessment, if any;

    (d)

    the human oversight measures referred to in Article 14, including the technical
    measures put in place to facilitate the interpretation of the outputs of the high-risk
    AI systems by the deployers;

    (e)

    the computational and hardware resources needed, the expected lifetime of the
    high-risk AI system and any necessary maintenance and care measures, including
    their frequency, to ensure the proper functioning of that AI system, including
    as regards software updates;

    (f)

    where relevant, a description of the mechanisms included within the high-risk
    AI system that allows deployers to properly collect, store and interpret the logs
    in accordance with Article 12.'
